# What every proxied request carries upstream.
#
# Kept in one file because the two server blocks must not drift apart: a
# header set for the public site and forgotten for the console is the kind
# of difference nobody notices until a link in an email points at http://.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

# The upstream sets its own security headers, and nothing here adds to or
# rewrites them: passing them through untouched is the point.

proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Uploads and PDF downloads stream rather than being spooled whole.
proxy_buffering off;
proxy_request_buffering off;
