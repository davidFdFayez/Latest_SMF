# The edge: terminates TLS and routes each hostname to its container.
#
# Why this file exists. The web and admin containers listen on plain :80 and
# publish to the host as :8080 and :8081. Something in front of them speaks
# HTTPS to the world, and until now that something lived only on the server —
# no copy in the repository, nothing to rebuild it from. The site could not
# be brought back from git alone. This is that piece, written down.
#
# It deliberately does very little. The containers already set their own
# security headers, serve their own robots.txt, refuse scrapers, and proxy
# /api to the API over the internal network. Repeating any of that here would
# give two places to change and one of them would go stale. The edge only
# does what the containers cannot do for themselves: hold the certificates,
# and decide which hostname is which.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # SEC-06 — no version in the Server header. nginx without the
    # headers-more module cannot drop the header altogether, so this leaves
    # a bare "nginx"; behind Cloudflare in production it becomes
    # "cloudflare" and the question goes away.
    server_tokens off;

    # Logged with the real client address rather than the proxy's.
    log_format edge '$remote_addr - $host "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log edge;

    # Modern TLS only. The federation has no clients old enough to need less.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # What each hostname is answered by. Both are host ports published by
    # docker-compose.yml; the edge reaches them over the host gateway rather
    # than the compose network, so it keeps working if the edge is run
    # outside compose.
    upstream smf_web {
        server host.docker.internal:8080;
        keepalive 16;
    }

    upstream smf_admin {
        server host.docker.internal:8081;
        keepalive 16;
    }

    # ── plain HTTP: nothing is served over it ──────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Certificate renewal is the one thing that has to answer on :80.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── the public site ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name smf.187-124-4-73.sslip.io;

        ssl_certificate     /etc/letsencrypt/live/smf.187-124-4-73.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smf.187-124-4-73.sslip.io/privkey.pem;

        # SEC-03 — the one header the containers cannot set for themselves,
        # because it is only meaningful on a connection that is already TLS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://smf_web;
            include /etc/nginx/snippets/smf-proxy.conf;
        }
    }

    # ── the console ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name admin.187-124-4-73.sslip.io;

        ssl_certificate     /etc/letsencrypt/live/admin.187-124-4-73.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.187-124-4-73.sslip.io/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://smf_admin;
            include /etc/nginx/snippets/smf-proxy.conf;
        }
    }

    # ── anything else ──────────────────────────────────────────────────────
    # A request for a hostname that is not ours is not served, rather than
    # being handed whichever server block happens to come first.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/smf.187-124-4-73.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smf.187-124-4-73.sslip.io/privkey.pem;

        return 444;
    }
}
