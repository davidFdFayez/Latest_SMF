services:
  api:
    build:
      context: ./backend/Smf.Api
      dockerfile: Dockerfile
    image: smf-api:latest
    container_name: smf-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/app/data/smf.db
      # Read from .env, which is not in the repository. This file is, and
      # the repository is public: a signing key written here is a published
      # one, and anyone holding it can mint an administrator's token without
      # ever seeing a password. There is no default on purpose — the API
      # refuses to start without it rather than falling back to something
      # guessable.
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      Jwt__Issuer: Smf.Api
      Jwt__Audience: Smf.Clients
      Jwt__ExpiryMinutes: "480"
      # Where the console lives, for password-reset links.
      Admin__BaseUrl: https://admin.187-124-4-73.sslip.io
      # Where the public site lives. Membership-card links and the QR codes
      # printed from them are built from this, so a wrong value prints cards
      # that lead nowhere.
      Site__BaseUrl: https://smf.187-124-4-73.sslip.io
      # Applicant notifications (§6) are only delivered once a mail server is
      # set here; until then each message is written to /app/data/outbox.
      Email__Host: ""
      Email__Port: "587"
      Email__UseSsl: "true"
      Email__User: ""
      Email__Password: ""
      Email__From: info@saudimuaythai.sa
      # Set once an SMS gateway is contracted; until then messages go to
      # /app/data/sms-outbox.
      Sms__Provider: ""
      # The first administrator, created only on an empty database. Also from
      # .env, for the same reason.
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - smf-api-data:/app/data
    networks:
      - smfnet

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: smf-web:latest
    container_name: smf-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - smfnet

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    image: smf-admin:latest
    container_name: smf-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"
    networks:
      - smfnet

volumes:
  smf-api-data:

networks:
  smfnet:
    external: true
    name: smfnet
