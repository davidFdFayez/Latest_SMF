server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # SEC-06 — never advertise the nginx version (Cloudflare would mask this in
    # production anyway, but the origin must not leak it on its own).
    server_tokens off;

    include /etc/nginx/snippets/smf-security-headers.conf;

    # SEC-04 — SEO scrapers, content harvesters, and AI crawlers are refused
    # here rather than merely asked to leave in robots.txt. See bot-rules.conf.
    if ($smf_blocked_bot) {
        return 403;
    }

    # SEC-04 — a real robots file, not the SPA shell. `try_files ... =404` keeps
    # the catch-all rewrite from turning a missing file back into index.html.
    location = /robots.txt {
        include /etc/nginx/snippets/smf-security-headers.conf;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/smf-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/smf-security-headers.conf;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        include /etc/nginx/snippets/smf-security-headers.conf;
        proxy_pass http://smf-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # The API sets its own copies of these; keep one of each.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Server;
    }

    location = /index.html {
        include /etc/nginx/snippets/smf-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/smf-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
