<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Muaythai referee raising the winner's arm">
  <defs>
    <linearGradient id="o-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7048"/>
      <stop offset="1" stop-color="#062d1d"/>
    </linearGradient>
    <linearGradient id="o-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C766"/>
      <stop offset="1" stop-color="#C39A2A"/>
    </linearGradient>
    <pattern id="o-diag" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0v18" stroke="#ffffff" stroke-opacity=".05" stroke-width="6"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#o-bg)"/>
  <rect width="400" height="300" fill="url(#o-diag)"/>
  <circle cx="200" cy="46" r="92" fill="#ffffff" opacity=".045"/>

  <!-- referee (centre) -->
  <g fill="url(#o-gold)">
    <circle cx="200" cy="112" r="23"/>
    <path d="M200 139c20 0 34 12 37 29l6 41c1 7-4 12-11 12h-64c-7 0-12-5-11-12l6-41c3-17 17-29 37-29z"/>
    <path d="M182 226h16l-4 42h-16zM204 226h16l4 42h-16z"/>
  </g>

  <!-- raised arms holding two competitors' wrists -->
  <g fill="url(#o-gold)">
    <path d="M164 148l-40-34 12-14 42 36z"/>
    <path d="M236 148l40-34-12-14-42 36z"/>
    <circle cx="118" cy="106" r="17"/>
    <circle cx="282" cy="106" r="17"/>
  </g>

  <!-- referee stripes -->
  <g stroke="#062d1d" stroke-opacity=".45" stroke-width="5">
    <path d="M186 156v54M200 156v54M214 156v54"/>
  </g>

  <rect x="0" y="288" width="400" height="12" fill="url(#o-gold)" opacity=".9"/>
</svg>
