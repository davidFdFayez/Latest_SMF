<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Muaythai club and training ring">
  <defs>
    <linearGradient id="k-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7048"/>
      <stop offset="1" stop-color="#062d1d"/>
    </linearGradient>
    <linearGradient id="k-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C766"/>
      <stop offset="1" stop-color="#C39A2A"/>
    </linearGradient>
    <pattern id="k-diag" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0v18" stroke="#ffffff" stroke-opacity=".05" stroke-width="6"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#k-bg)"/>
  <rect width="400" height="300" fill="url(#k-diag)"/>
  <circle cx="330" cy="240" r="100" fill="#ffffff" opacity=".04"/>

  <!-- ring platform in perspective -->
  <g>
    <path d="M78 214l122-38 122 38-122 40z" fill="url(#k-gold)" opacity=".95"/>
    <path d="M78 214v26l122 40v-40z" fill="#C39A2A" opacity=".75"/>
    <path d="M322 214v26l-122 40v-40z" fill="#8f6f16" opacity=".65"/>
  </g>

  <!-- corner posts -->
  <g fill="url(#k-gold)">
    <rect x="72" y="128" width="12" height="90" rx="4"/>
    <rect x="316" y="128" width="12" height="90" rx="4"/>
    <rect x="194" y="104" width="12" height="76" rx="4"/>
  </g>

  <!-- ropes -->
  <g stroke="#E8C766" stroke-width="4" stroke-linecap="round" opacity=".9">
    <path d="M78 146l122-22 122 22M78 168l122-22 122 22M78 190l122-22 122 22"/>
  </g>

  <!-- club banner -->
  <g>
    <rect x="150" y="40" width="100" height="52" rx="8" fill="url(#k-gold)"/>
    <path d="M150 92h100l-14 16h-72z" fill="#C39A2A"/>
    <g fill="#062d1d" opacity=".8">
      <circle cx="200" cy="60" r="8"/>
      <path d="M182 80c0-10 8-16 18-16s18 6 18 16z"/>
    </g>
  </g>

  <rect x="0" y="288" width="400" height="12" fill="url(#k-gold)" opacity=".9"/>
</svg>
