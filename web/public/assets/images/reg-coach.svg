<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Muaythai coach with focus pads">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7048"/>
      <stop offset="1" stop-color="#062d1d"/>
    </linearGradient>
    <linearGradient id="c-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C766"/>
      <stop offset="1" stop-color="#C39A2A"/>
    </linearGradient>
    <pattern id="c-diag" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0v18" stroke="#ffffff" stroke-opacity=".05" stroke-width="6"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#c-bg)"/>
  <rect width="400" height="300" fill="url(#c-diag)"/>
  <circle cx="82" cy="58" r="88" fill="#ffffff" opacity=".045"/>

  <g fill="url(#c-gold)">
    <!-- coach -->
    <circle cx="168" cy="100" r="24"/>
    <path d="M168 128c21 0 36 12 39 31l6 44c1 7-4 12-11 12h-68c-7 0-12-5-11-12l6-44c3-19 18-31 39-31z"/>
    <path d="M148 219h17l-4 44h-17zM172 219h17l4 44h-17z"/>
    <!-- whistle lanyard -->
    <path d="M156 124l12 26 12-26-4-2-8 17-8-17z" opacity=".85"/>
  </g>

  <!-- focus pads held out -->
  <g>
    <rect x="242" y="112" width="52" height="70" rx="14" fill="url(#c-gold)"/>
    <rect x="254" y="126" width="28" height="42" rx="10" fill="#062d1d" opacity=".35"/>
    <rect x="242" y="112" width="52" height="70" rx="14" fill="none" stroke="#062d1d" stroke-opacity=".4" stroke-width="3"/>
    <!-- arm to pad -->
    <path d="M204 150h44v18h-44z" fill="url(#c-gold)"/>
  </g>

  <!-- impact marks -->
  <g stroke="#E8C766" stroke-width="4" stroke-linecap="round" opacity=".55">
    <path d="M306 128l18-10M310 148h22M306 168l18 10"/>
  </g>

  <rect x="0" y="288" width="400" height="12" fill="url(#c-gold)" opacity=".9"/>
</svg>
