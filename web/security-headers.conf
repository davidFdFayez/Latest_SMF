# SEC-03 — protective response headers for the public site.
#
# Included in the server block *and* in every location that sets an add_header
# of its own: nginx replaces, rather than merges, the inherited add_header set
# as soon as a nested block declares one.
#
# `always` makes the headers apply to error responses too, which is where a
# scanner is most likely to look.
#
# The style-src / font-src allowances exist for the Google Fonts stylesheet in
# index.html; 'unsafe-inline' for styles is needed because the React components
# set inline style attributes. Scripts stay locked to same-origin.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Harmless before the Cloudflare cutover (browsers ignore it over plain HTTP)
# and correct the moment the site is served over TLS at saudimuaythai.sa.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
