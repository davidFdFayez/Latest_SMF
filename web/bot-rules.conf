# SEC-04 — user agents refused at the edge of the origin.
#
# This file lives at http level (conf.d/*.conf is included inside http), which
# is the only context a `map` is allowed in.
#
# Three groups are blocked:
#   • SEO/backlink crawlers, which generate the bulk of the junk traffic and
#     give the federation nothing back;
#   • content scrapers and dataset builders;
#   • AI training and retrieval bots, which robots.txt asks to stay away but
#     which are only actually stopped at this level.
#
# Search engines the federation *wants* (Googlebot, Bingbot, DuckDuckBot,
# YandexBot, Applebot, Slurp) and ordinary tooling such as curl are untouched,
# so the launch checks in the requirements still work.

map $http_user_agent $smf_blocked_bot {
    default 0;

    # SEO / backlink crawlers
    "~*(ahrefsbot|semrushbot|mj12bot|dotbot|blexbot|dataforseobot|seekportbot|serpstatbot|barkrowler|zoominfobot|linkdexbot|sistrix|megaindex|seznambot|rogerbot|exabot|spbot)" 1;

    # Scrapers and dataset builders
    "~*(bytespider|petalbot|diffbot|omgili|imagesiftbot|magpie-crawler|meltwater|scrapy|httrack|webzip|wget/|libwww-perl|node-fetch|zgrab|masscan)" 1;

    # AI training / retrieval agents
    "~*(gptbot|chatgpt-user|oai-searchbot|ccbot|claudebot|claude-web|anthropic-ai|perplexitybot|perplexity-user|youbot|amazonbot|applebot-extended|facebookbot|meta-externalagent|cohere-ai|timpibot|img2dataset|omgilibot)" 1;

    # No user agent at all is not a browser.
    "" 1;
}
